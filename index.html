<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hyper Quests – Waitlist</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-lightning">
  <div class="page">
    <div class="card">
      
      <div class="badge">⚡ Launching Soon</div>

      <h1 class="logo-glow">Hyper Quests</h1>

      <p class="tagline">
        Daily crypto & web3 quests. Learn, play, and earn rewards.
      </p>

      <p class="subtext">
        Something big is coming. Join the early waitlist and get first access to Season 0.
      </p>

      <div class="pill-row">
        <span class="pill">Quests & streaks</span>
        <span class="pill">XP & rewards</span>
        <span class="pill">Web3 native</span>
      </div>

      <!-- X BUTTON -->
      <a 
        href="https://x.com/hyperquests" 
        class="x-btn" 
        target="_blank" 
        rel="noopener noreferrer"
      >
        Follow @hyperquests on X
      </a>

      <!-- WAITLIST FORM -->
      <form id="waitlistForm" class="waitlist-form">
        <input 
          type="email" 
          id="emailInput"
          placeholder="Enter your email address" 
          required
        />
        <button type="submit">Join the Waitlist</button>
      </form>

      <p id="statusMsg" class="hint"></p>

      <p class="footer">
        Made by <span>Team</span>
      </p>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
