<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hyper Quests – Waitlist</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-lightning">
  <div class="page">
    <div class="card">
      <div class="badge">⚡ Launching Soon</div>

      <h1 class="logo-glow">Hyper Quests</h1>
      <p class="tagline">
        Daily crypto & web3 quests. Learn, play, and earn rewards.
      </p>

      <p class="subtext">
        Drop your email to join the early waitlist and get first access.
      </p>

      <!-- ✅ Waitlist form (uses Firebase via app.js) -->
      <form id="waitlistForm" class="waitlist-form">
        <input 
          type="email" 
          id="emailInput"
          placeholder="Enter your email address" 
          required
        />
        <button type="submit">Join the Waitlist</button>
      </form>

      <!-- message set by app.js (success / error) -->
      <p id="statusMsg" class="hint"></p>

      <div class="divider">
        <span></span>
        <p>or</p>
        <span></span>
      </div>

      <!-- ✅ X (Twitter) button -->
      <a 
        href="https://x.com/hyperquests" 
        class="x-btn" 
        target="_blank" 
        rel="noopener noreferrer"
      >
        Follow @hyperquests on X
      </a>

      <p class="footer">
        Built by <span>beingsoumendra</span>
        • <a href="admin.html" class="admin-link">View waitlist (admin)</a>
      </p>
    </div>
  </div>

  <!-- Firebase + app logic -->
  <script type="module" src="app.js"></script>
</body>
</html>
